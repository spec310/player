<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17191d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css?v=1.2.1"><title>Player</title></head><body><main><header><div><h1>Player</h1><small id="offline">準備中</small></div><button id="add" class="add" aria-label="ファイル追加">＋ 追加</button><input type="file" id="files" accept="audio/*,video/*,.mp4,.m4a,.mp3,.wav,.mov,.aac,.webm,.ogg,.flac" multiple hidden></header><section class="player"><div id="art" class="art" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="1" opacity=".4"/><path d="M44 66V31L72 25V60M44 40L72 34" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="36" cy="67" rx="10" ry="7" fill="currentColor"/><ellipse cx="64" cy="61" rx="10" ry="7" fill="currentColor"/></svg></div><div id="videoStage" hidden><video id="video" preload="auto" playsinline controls></video><button id="exitLandscape" aria-label="音声モードに戻す">×</button><button id="fullVideo" aria-label="全画面再生">⛶</button></div><button id="videoMode" class="sub" aria-pressed="false" hidden>映像を表示</button><h2 id="name">ファイルを追加</h2><p id="count">端末内の音声・動画</p><input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置" disabled><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="controls"><button id="shuffle" aria-label="シャッフル" aria-pressed="false">⤨</button><button id="prev" aria-label="前のファイル">|◀</button><button id="play" class="play" aria-label="再生">▶</button><button id="next" aria-label="次のファイル">▶|</button><button id="repeat" aria-label="リピート" aria-pressed="false">↻</button></div><audio id="audio" preload="auto" playsinline></audio><p id="status" role="status" aria-live="polite">MP4は音声または映像で再生できます。</p></section><section class="library"><div class="library-head"><h3>ライブラリ</h3><span id="size">0 件</span></div><div class="folderbar"><select id="folder" aria-label="フォルダー"><option value="all">すべて</option><option value="root">未分類</option></select><button id="newFolder" class="sub">＋ フォルダー</button><button id="selectMode" class="sub" aria-pressed="false">選択</button></div><div id="bulk" class="bulk" hidden><span id="selectedCount">0 件選択</span><button id="selectAll">全選択</button><button id="move" disabled>フォルダーへ移動</button><button id="bulkDelete" class="danger" disabled>削除</button></div><p id="libraryStatus" role="status" aria-live="polite"></p><ol id="list"></ol><p id="empty">「＋ 追加」からファイルを選択</p></section><footer>端末内保存 · 広告なし · v1.2.1<br><button id="checkUpdate" class="sub" type="button">更新を確認</button><small id="updateStatus" role="status"></small><br>元ファイルは別途保管してください。</footer></main><div id="moveSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="moveTitle" hidden><div class="sheetPanel"><div class="sheetHead"><h2 id="moveTitle">移動先を選択</h2><button id="moveCancel" aria-label="キャンセル">×</button></div><p id="moveSummary"></p><div id="moveTargets"></div><label for="moveNewName">新しいフォルダーへ移動</label><div class="newTarget"><input id="moveNewName" maxlength="200" placeholder="フォルダー名"><button id="moveCreate" class="sub">作成して移動</button></div><button id="moveBack" class="sub">キャンセル</button><p id="moveError" role="status"></p></div></div><script src="app.js?v=1.2.1" defer></script></body></html>
